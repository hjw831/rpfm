<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPFM MCP Server Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .status-glow-online { box-shadow: 0 0 15px rgba(34, 197, 94, 0.5); }
        .status-glow-offline { box-shadow: 0 0 15px rgba(239, 68, 68, 0.5); }
        .toggle-checkbox:checked { right: 0; border-color: #22c55e; }
        .toggle-checkbox:checked + .toggle-label { background-color: #22c55e; }
        .log-container::-webkit-scrollbar { width: 8px; }
        .log-container::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-2xl w-full glass rounded-3xl p-8 shadow-2xl">
        <!-- Header -->
        <div class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-3xl font-bold text-white flex items-center gap-3">
                    <i class="fa-solid fa-server text-blue-400"></i>
                    RPFM MCP Server
                </h1>
                <p class="text-slate-400 mt-1">Server Management Dashboard</p>
            </div>
            <div id="status-indicator" class="flex items-center gap-2 px-4 py-2 rounded-full bg-slate-800 text-sm font-medium border border-slate-700">
                <span id="status-dot" class="w-3 h-3 rounded-full bg-red-500 status-glow-offline"></span>
                <span id="status-text">Checking...</span>
            </div>
        </div>

        <!-- Main Control Card -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <!-- Power Toggle -->
            <div class="glass rounded-2xl p-6 flex flex-col items-center justify-center gap-4 border-blue-500/30">
                <span class="text-lg font-semibold text-slate-200">Power Control</span>
                <div class="relative inline-block w-14 h-8 align-middle select-none transition duration-200 ease-in">
                    <input type="checkbox" name="toggle" id="server-toggle" class="toggle-checkbox absolute block w-8 h-8 rounded-full bg-white border-4 appearance-none cursor-pointer transition-all duration-300 right-6"/>
                    <label for="server-toggle" class="toggle-label block overflow-hidden h-8 rounded-full bg-slate-600 cursor-pointer transition-all duration-300"></label>
                </div>
                <span id="toggle-label" class="text-sm text-slate-400">OFF</span>
            </div>

            <!-- Quick Test -->
            <div class="glass rounded-2xl p-6 flex flex-col items-center justify-center gap-4 border-emerald-500/30">
                <span class="text-lg font-semibold text-slate-200">Quick Analysis</span>
                <button id="btn-test" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold transition-all active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    List Tenzin Pack
                </button>
            </div>
        </div>

        <!-- Log Area -->
        <div class="glass rounded-2xl p-6 border-slate-700">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-slate-300 flex items-center gap-2">
                    <i class="fa-solid fa-terminal text-slate-500"></i>
                    Status Log
                </h2>
                <button id="btn-clear" class="text-xs text-slate-500 hover:text-slate-300 transition-colors">Clear Log</button>
            </div>
            <div id="log-output" class="log-container h-48 overflow-y-auto bg-black/50 rounded-xl p-4 font-mono text-sm text-emerald-400 border border-slate-800 space-y-1">
                <div class="text-slate-500 italic">Welcome to RPFM Control Panel. Waiting for actions...</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:5000';
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const serverToggle = document.getElementById('server-toggle');
        const toggleLabel = document.getElementById('toggle-label');
        const logOutput = document.getElementById('log-output');
        const btnTest = document.getElementById('btn-test');
        const btnClear = document.getElementById('btn-clear');

        function addLog(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            const color = type === 'error' ? 'text-red-400' : (type === 'success' ? 'text-emerald-400' : 'text-slate-400');
            div.className = color;
            div.innerHTML = `<span class="text-slate-600">[${time}]</span> ${message}`;
            logOutput.appendChild(div);
            logOutput.scrollTop = logOutput.scrollHeight;
        }

        async function updateStatus() {
            try {
                const res = await fetch(`${API_BASE}/status`);
                const data = await res.json();
                
                if (data.status === 'running') {
                    statusDot.className = 'w-3 h-3 rounded-full bg-green-500 status-glow-online';
                    statusText.innerText = 'ONLINE';
                    serverToggle.checked = true;
                    toggleLabel.innerText = 'ON';
                } else {
                    statusDot.className = 'w-3 h-3 rounded-full bg-red-500 status-glow-offline';
                    statusText.innerText = 'OFFLINE';
                    serverToggle.checked = false;
                    toggleLabel.innerText = 'OFF';
                }
            } catch (e) {
                statusText.innerText = 'CONN ERROR';
                addLog('Failed to connect to manager API. Is rpfm_manager.py running?', 'error');
            }
        }

        serverToggle.addEventListener('change', async () => {
            const endpoint = serverToggle.checked ? '/start' : '/stop';
            const action = serverToggle.checked ? 'Starting' : 'Stopping';
            
            addLog(`${action} server...`);
            try {
                const res = await fetch(`${API_BASE}${endpoint}`);
                const data = await res.json();
                if (data.result === 'success') {
                    addLog(data.message, 'success');
                } else {
                    addLog(data.message, 'error');
                    serverToggle.checked = !serverToggle.checked;
                }
                updateStatus();
            } catch (e) {
                addLog('API communication error.', 'error');
                serverToggle.checked = !serverToggle.checked;
            }
        });

        btnTest.addEventListener('click', async () => {
            addLog('Requesting Tenzin Pack list...');
            btnTest.disabled = true;
            btnTest.classList.add('opacity-50');
            
            try {
                const res = await fetch(`${API_BASE}/test`);
                const data = await res.json();
                if (data.result === 'success') {
                    addLog('Successfully retrieved pack files!', 'success');
                    const pre = document.createElement('pre');
                    pre.className = 'text-xs text-white bg-slate-900 p-2 rounded my-2 overflow-x-auto border border-slate-700';
                    pre.innerText = data.data;
                    logOutput.appendChild(pre);
                } else {
                    addLog(data.message, 'error');
                }
            } catch (e) {
                addLog('Test failed. Ensure server is running.', 'error');
            } finally {
                btnTest.disabled = false;
                btnTest.classList.remove('opacity-50');
                logOutput.scrollTop = logOutput.scrollHeight;
            }
        });

        btnClear.addEventListener('click', () => {
            logOutput.innerHTML = '<div class="text-slate-500 italic">Log cleared.</div>';
        });

        // Initial status check
        updateStatus();
        // Auto-refresh status every 5 seconds
        setInterval(updateStatus, 5000);
    </script>
</body>
</html>
